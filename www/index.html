<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: black; 
            overflow: hidden; 
        }
        #container { 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        ruffle-player { 
            width: 100%; 
            height: 100%; 
        }
    </style>
    <!-- Path check karein: ruffle.js aapne www folder mein direct upload ki hai -->
    <script src="ruffle.js"></script>
</head>
<body>
    <div id="container"></div>
    <script>
        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            document.getElementById("container").appendChild(player);

            // YEH HAI ASAL FIX: Ruffle ko scale aur letterbox set karna
            player.load({
                url: "app://localhost/game.swf", // Aapke Swift code ka path
                scale: "showAll",                // Game ko screen mein fit karega
                letterbox: "on",                 // Agar screen lambi ho toh black bars aayenge (stretch nahi hoga)
                quality: "high",                 // Graphics high quality
                autoplay: "on"                   // Foran chalayega
            });
        });
    </script>
</body>
</html>
