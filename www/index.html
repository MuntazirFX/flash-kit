<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* YEH CSS GAME KO SCREEN MEIN FIT KAREGI */
        ruffle-player, ruffle-player canvas {
            width: 100% !important;
            height: 100% !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            object-fit: contain !important; /* Aspect ratio maintain rakhega */
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <script src="ruffle.js"></script>
    <script>
        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            // Ruffle ko batana ke screen ke hisaab se scale kare
            player.style.width = "100%";
            player.style.height = "100%";
            document.getElementById("container").appendChild(player);
            player.load("app://localhost/game.swf");
        });
    </script>
</body>
</html>
