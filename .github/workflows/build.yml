name: Build FlashKit
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install XcodeGen
      run: brew install xcodegen
      
    - name: Generate Xcode Project
      run: |
        echo "name: FlashKit
        options:
          bundleIdPrefix: com.muntazir
        targets:
          FlashKit:
            type: application
            platform: iOS
            deploymentTarget: \"15.0\"
            sources: [Sources]
            resources: [www]
            settings:
              GENERATE_INFOPLIST_FILE: YES" > project.yml
        xcodegen generate
        
    - name: Build App
      run: |
        # Yahan humne -derivedDataPath build add kiya hai taake app ek fix jagah bane
        xcodebuild -project FlashKit.xcodeproj -scheme FlashKit -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath build
        mkdir Payload
        # Ab app yahan milegi
        cp -r build/Build/Products/Release-iphoneos/FlashKit.app Payload/
        zip -r FlashKit.ipa Payload
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: FlashKit-IPA
        path: FlashKit.ipa
